<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World | EdgeOne</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #eef4ff; }
    main { max-width: 36rem; padding: 3rem 1.5rem; text-align: center; }
    h1 { font-size: clamp(2.5rem, 10vw, 5rem); margin: 0 0 1rem; }
    p { line-height: 1.8; color: #c3d0e5; }
    button { padding: .8rem 1.4rem; border: 0; border-radius: .7rem; background: #78c9ff; color: #101827; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World!</h1>
    <p>这是我的第一个 EdgeOne 个人主页。</p>
    <button id="hello" type="button">点击打个招呼</button>
    <p id="message" aria-live="polite">网页已加载，试试上面的按钮。</p>
  </main>
  <script>
    document.getElementById('hello').addEventListener('click', function () {
      document.getElementById('message').textContent = '你好！前端交互运行正常。';
    });
  </script>
</body>
</html>
